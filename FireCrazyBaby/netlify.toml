# Netlify configuration for the AI & Law blog project.
# You should not need to edit this file.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Make sure the scheduled function keeps working even if Netlify's
# framework auto-detection changes in the future.
[functions]
  node_bundler = "esbuild"
